name: Сборка выпуска

# Запускается, когда в репозиторий приходит тег вида v1.7: собирает STALZONE-Tracker.exe
# на Windows и выкладывает выпуск (Release). Программа сама найдёт его и предложит обновиться.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Модули
        run: python -m pip install --upgrade pip requests pywebview pyinstaller

      - name: Версия в программе совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path stalzone_app.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { Write-Error "Тег $tag, а в программе APP_VERSION = $ver"; exit 1 }

      - name: Самопроверка
        run: python stalzone_tracker.py --selftest

      - name: Сборка .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name STALZONE-Tracker --icon stalzone.ico stalzone_app.py

      - name: Архив исходников
        shell: pwsh
        run: Compress-Archive -Path stalzone_app.py, stalzone_tracker.py, stalzone.ico, build_exe.bat, README.txt -DestinationPath stalzone_source.zip

      - name: Выпуск
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/STALZONE-Tracker.exe
            stalzone_source.zip
