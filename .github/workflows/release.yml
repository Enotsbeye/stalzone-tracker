name: Сборка выпуска

# Запускается, когда в этом (закрытом) репозитории публикуют выпуск: Releases → Draft a new release →
# тег вида v1.8 → Publish. Собирает STALZONE-Tracker.exe на Windows, прикладывает к этому выпуску
# и выкладывает такой же выпуск — только .exe, без кода — в открытый Enotsbeye/stalzone-tracker-releases.
# Оттуда программа у всех сама находит обновления. Нужен секрет RELEASES_TOKEN — токен с правом
# Contents: Read and write на открытый репозиторий.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег уже опубликованного выпуска, например v1.7"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Версия в программе совпадает с тегом
        shell: bash
        run: |
          ver=$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' stalzone_app.py | tr -d '\r')
          echo "Тег $TAG, в программе APP_VERSION = $ver"
          if [ "${TAG#v}" != "$ver" ]; then
            echo "::error::Тег $TAG не совпадает с APP_VERSION = $ver в stalzone_app.py"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Модули
        run: python -m pip install --upgrade pip requests pywebview cryptography pyinstaller

      - name: Самопроверка
        run: python stalzone_tracker.py --selftest

      - name: Сборка .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name STALZONE-Tracker --icon stalzone.ico stalzone_app.py

      - name: Архив исходников
        shell: pwsh
        run: Compress-Archive -Path stalzone_app.py, stalzone_tracker.py, stalzone.ico, build_exe.bat, README.txt -DestinationPath stalzone_source.zip

      - name: Файлы к выпуску (здесь, вместе с исходниками)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            dist/STALZONE-Tracker.exe
            stalzone_source.zip

      - name: Токен для открытого репозитория на месте
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Нет секрета RELEASES_TOKEN — без него .exe не выложить в stalzone-tracker-releases"
            exit 1
          fi

      - name: Выпуск в открытом репозитории (только .exe)
        uses: softprops/action-gh-release@v2
        with:
          repository: Enotsbeye/stalzone-tracker-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: STALZONE Трекер ${{ env.TAG }}
          body_path: release_notes.md
          make_latest: "true"
          files: dist/STALZONE-Tracker.exe
